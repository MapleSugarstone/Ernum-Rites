name = "ernum-rites-server"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# The Origin header the browser sends, so no repo path and the username
# lowercased the way Pages serves it. Add any custom domain here too.
[vars]
ALLOWED_ORIGINS = "https://maplesugarstone.github.io,http://localhost:5173"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

# One instance for the whole deployment: the only place that knows which room
# a waiting player is sitting in.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
