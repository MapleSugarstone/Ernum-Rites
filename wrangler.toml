name = "ernum-rites-server"
main = "worker/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# The Origin header the browser sends, so no repo path and the username
# lowercased the way Pages serves it. Add any custom domain here too.
[vars]
ALLOWED_ORIGINS = "https://maplesugarstone.github.io,http://localhost:5173"

# Without this nothing server-side is retained, so an incident nobody happened
# to be tailing leaves no record anywhere.
[observability]
enabled = true

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

# One instance for the whole deployment: the only place that knows which room
# a waiting player is sitting in.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

# Finished games, one instance for the deployment: what the bot's play against
# people is measured on. Reading it back needs the LOG_TOKEN secret
# (`wrangler secret put LOG_TOKEN`); writing needs an allowed origin.
[[durable_objects.bindings]]
name = "GAME_LOG"
class_name = "GameLogStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GameLogStore"]
